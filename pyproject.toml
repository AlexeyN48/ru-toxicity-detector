[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-toxicity-detector"
version = "0.1.0"
description = "Toxic comment detection for Russian based on fine-tuned ruBERT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pymorphy3>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# torch with CUDA is installed separately, see README
train = [
    "accelerate>=1.0",
    "torch>=2.4",
    "transformers>=5.0",
]
# local web demo: python -m toxicity.app
demo = [
    "gradio>=5.0",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- uv
# PyTorch with CUDA 13.0 on Windows/Linux; macOS gets the regular build from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode in strings: false positives on Cyrillic text
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]  # imports in the middle of a notebook are fine

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
